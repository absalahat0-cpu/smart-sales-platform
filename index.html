<title>منصة المبيعات الذكية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{--c1:#2563eb;--c2:#ea580c;--c3:#16a34a;--bg:#f6f7f9;--cd:#fff;--tx:#14202b;--mu:#66727f;--a:#0f766e;--b:#d97706;--bd:#e3e7ec;--bad:#c2410c;--ok:#15803d;--ty:#ca8a04;--wn:#e0a800;--wnb:#b88700;--wnt:#1f1700}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#60a5fa;--c2:#fb923c;--c3:#4ade80;--bg:#0e141a;--cd:#17202a;--tx:#e8edf2;--mu:#93a0ad;--a:#2dd4bf;--b:#fbbf24;--bd:#27333f;--bad:#fb923c;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--c1:#60a5fa;--c2:#fb923c;--c3:#4ade80;--bg:#0e141a;--cd:#17202a;--tx:#e8edf2;--mu:#93a0ad;--a:#2dd4bf;--b:#fbbf24;--bd:#27333f;--bad:#fb923c;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo","Tajawal",system-ui,sans-serif;font-size:14px;line-height:1.6}
nav{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
nav b{margin-inline-end:auto;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
.tb{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--mu)}
.tb.on{background:var(--a);color:var(--bg)}
html[data-theme="light"] .tb.on{color:#fff}
#lg{background:var(--ty);color:#1a1300;font-weight:700;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--b);color:#000;font-weight:700}
.btn{border:1px solid var(--a);background:var(--a);color:var(--bg);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn.o{background:none;color:var(--a)}.btn:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1000px;margin:0 auto;padding:16px}
.nb{display:inline-block;min-width:18px;padding:0 6px;margin-inline-start:4px;border-radius:99px;font-size:12px;line-height:18px;text-align:center;font-weight:700;background:rgba(128,128,128,.35);color:inherit}.nb.hot{background:#dc2626;color:#fff}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--b);color:#000}
.tag.real{background:var(--ok);color:#000}
.g{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}
.c h3{margin:0 0 8px;font-size:15px}.mu{color:var(--mu);font-size:13px}
.kv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.up{color:var(--ok)}.dn{color:var(--bad)}
svg{width:100%;height:auto;display:block;direction:ltr}svg text{fill:var(--mu);font-size:10px}
.sec{display:none}.sec.on{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:3px 4px;text-align:start}
input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:3px 6px}
ul.ck{padding-inline-start:20px;margin:6px 0}.ck li{margin:3px 0}
.m{max-width:85%;padding:6px 10px;border-radius:10px;margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.u{background:var(--a);color:var(--bg);margin-inline-start:auto}.a{background:var(--cd);border:1px solid var(--bd)}
.pg td,.pg th{padding:2px;text-align:center}.pg button{width:100%;min-width:34px;border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:4px 0;cursor:pointer;font-size:12px}
.pg button.cA{background:var(--c1);color:#fff;border-color:var(--c1)}.pg button.cB{background:var(--c2);color:#fff;border-color:var(--c2)}.pg button.cAB{background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);color:#fff}
.pg button:disabled{opacity:.25;cursor:default}.pg th button{background:none;border:0;color:var(--mu)}
.ch{padding:4px 12px;border-radius:99px;font-size:13px;color:var(--bg)}.ch.a{background:var(--c1);color:#fff}.ch.b{background:var(--c2);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc{overflow-x:auto;max-height:320px;overflow-y:auto}
.cw{background:var(--wn);color:var(--wnt);border:1px solid var(--wnb);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:13px}
.ctb{font-size:12px}.ctb th{color:var(--mu);font-weight:600;border-bottom:1px solid var(--bd)}.ctb td{border-bottom:1px solid var(--bd);vertical-align:top}
.core{font-size:10px;background:var(--a);color:var(--bg);border-radius:99px;padding:0 6px;margin-inline-start:4px}
/* notice */
#nt{max-width:1000px;margin:0 auto;padding:10px 16px 0}
#nt .nb{background:var(--wn);color:var(--wnt);border:1px solid var(--wnb);border-radius:8px;padding:5px 10px;font-size:12px;line-height:1.5}
#nt summary{cursor:pointer}#nt ul{margin:4px 0 0;padding-inline-start:18px}
/* chatbot */
#cb{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50}
#cbBtn{width:64px;height:64px;border-radius:50%;border:0;padding:0;cursor:pointer;background:linear-gradient(145deg,var(--a),#0b4f4a);box-shadow:0 6px 18px rgba(0,0,0,.3);animation:flt 3.2s ease-in-out infinite;position:relative;display:grid;place-items:center}

#cbBtn svg{width:42px;height:42px;transition:transform .25s;animation:wig 7s ease-in-out infinite}
#cbBtn:hover svg,#cbBtn:focus-visible svg{transform:scale(1.14) rotate(-6deg)}
#cbBtn:focus-visible{outline:3px solid var(--b);outline-offset:3px}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.ant{animation:ap 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#cbTip{position:absolute;bottom:50%;inset-inline-end:calc(100% + 12px);transform:translateY(50%) scale(.9);background:var(--tx);color:var(--bg);padding:6px 12px;border-radius:10px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#cbBtn:hover+#cbTip,#cbBtn:focus-visible+#cbTip{opacity:1;transform:translateY(50%) scale(1)}
#cb.open #cbBtn,#cb.open #cbTip{display:none}
#cbP{display:none;flex-direction:column;position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(520px,calc(100vh - 100px));background:var(--cd);border:1px solid var(--bd);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden;z-index:60;transform-origin:bottom right}
html[dir=rtl] #cbP{transform-origin:bottom left}
#cb.open #cbP{display:flex;animation:pop .22s ease-out}
#cbH{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--a);color:var(--bg)}
#cbH b{flex:1}
#cbH button{border:0;background:rgba(255,255,255,.2);color:inherit;border-radius:8px;min-width:32px;height:32px;cursor:pointer;font-size:15px}
#cbH button:hover{background:rgba(255,255,255,.35)}
#cbH button.arm{background:var(--bad);color:#000;font-size:12px;padding:0 8px}
#cbN{padding:4px 12px;font-size:11px;color:var(--mu);border-bottom:1px solid var(--bd)}
#log{flex:1;overflow-y:auto;padding:8px 10px;background:var(--bg)}
#cbF{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}
#q{flex:1;min-width:0;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.55);opacity:0}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ap{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
@keyframes wig{0%,88%,100%{rotate:0deg}91%{rotate:-10deg}94%{rotate:10deg}97%{rotate:-6deg}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#cbBtn,#cbBtn svg,#cbBtn::after,.eye,.ant,#cb.open #cbP{animation:none}}
#lp{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}.lpb{max-width:640px;width:100%;text-align:center}.lc{background:var(--cd);border:2px solid var(--bd);border-radius:16px;padding:24px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}.lc:hover{border-color:var(--a)}.lc span{font-size:40px}.lc b{font-size:20px}.lc small{color:var(--mu)}#t2 .c,#m2 .c{cursor:zoom-in}#zm{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:120;display:none;align-items:center;justify-content:center;padding:12px}#zm.on{display:flex}.zb{background:var(--cd);border-radius:14px;max-width:1100px;width:100%;max-height:92vh;overflow:auto;padding:18px}.zb svg{min-width:900px}.zb svg text{font-size:11px}.zb{font-size:16px}.zb .mu{font-size:15px}.zb .kv{font-size:32px}.zb .ctb,.zb table{font-size:15px}.zb .row div div{height:18px!important}.zb .sc{max-height:none!important}.zb .c{cursor:default}#t2 .c:hover,#m2 .c:hover{border-color:var(--a)}.zb h3{font-size:18px}details{margin:4px 0}summary{cursor:pointer}

body.locked>nav,body.locked>main,body.locked #cb,body.locked #lp,body.locked #zm,body.locked #pgn{display:none!important}
#au{position:fixed;inset:0;z-index:300;display:none;padding:18px;overflow:auto;background:radial-gradient(900px 520px at 8% -8%,rgba(15,118,110,.30),transparent 60%),radial-gradient(800px 480px at 100% 108%,rgba(217,119,6,.26),transparent 60%),var(--bg)}
#au.on{display:flex}
.atop{position:fixed;top:14px;inset-inline-end:14px;display:flex;gap:6px}
.ab{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.auc{margin:auto;width:100%;max-width:410px;background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:30px 26px 24px;box-shadow:0 18px 50px rgba(0,0,0,.16);text-align:center}
.alogo{width:58px;height:58px;margin:0 auto 10px;border-radius:16px;background:linear-gradient(135deg,#0f766e,#d97706);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 8px 20px rgba(15,118,110,.35)}
.auc h1{font-size:21px;margin:0 0 4px}.auc .sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.al{display:block;text-align:start;font-size:13px;font-weight:600;margin:10px 0 0;color:var(--tx)}
.ai{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;outline:none;font-family:inherit}
.ai:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.2)}
.apb{display:block;width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.apb:hover{filter:brightness(1.08)}.apb:disabled{opacity:.6;cursor:wait}
.asec{background:none;border:0;color:var(--a);cursor:pointer;font-size:13px;margin-top:12px;padding:2px 4px;font-family:inherit}
.am{margin-top:12px;padding:9px 12px;border-radius:10px;font-size:13px;text-align:start}.am.ok{background:rgba(21,128,61,.12);color:var(--ok)}.am.bad{background:rgba(194,65,12,.12);color:var(--bad)}.am.inf{background:rgba(15,118,110,.1);color:var(--tx)}
.aico{font-size:44px;margin:4px 0 6px}
.alogo svg{overflow:visible}.alogo .bb{fill:#fff;transform-box:fill-box;transform-origin:50% 100%;animation:abar 2.4s ease-in-out infinite}.alogo .b2{animation-delay:.25s}.alogo .b3{animation-delay:.5s}.alogo .b4{animation-delay:.75s}
.alogo .ln{fill:none;stroke:#fde68a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;animation:adraw 2.4s ease-in-out infinite}.alogo .dt{fill:#fde68a;animation:adot 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes abar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}@keyframes adraw{0%{stroke-dashoffset:90}55%,100%{stroke-dashoffset:0}}@keyframes adot{0%,45%{opacity:0;transform:scale(.3)}60%,100%{opacity:1;transform:scale(1)}}
@keyframes aup{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}@keyframes apop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.auc{animation:aup .5s cubic-bezier(.2,.8,.2,1)}
.apw{position:relative;display:block}.apw .ai{padding-inline-end:46px}.pwe{position:absolute;top:50%;inset-inline-end:8px;transform:translateY(-50%);background:none;border:0;padding:4px;cursor:pointer;color:#115e59;line-height:0;border-radius:8px;transition:color .2s,background .2s}.pwe:hover{color:#0d9488;background:rgba(15,118,110,.1)}.pwe svg{display:block}.pwe.on{color:#0f766e}
[data-theme=dark] .pwe{color:#5eead4}[data-theme=dark] .pwe:hover{color:#99f6e4}
.arem{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--tx);cursor:pointer;text-align:start}.arem input{width:16px;height:16px;accent-color:#0f766e}
.pwr{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:9px;text-align:start;font-size:12px;color:var(--mu)}.pr i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bd);margin-inline-end:6px;vertical-align:-3px;transition:all .25s}.pr.ok{color:var(--ok)}.pr.ok i{background:var(--ok);border-color:var(--ok);animation:apop .3s}.pr.ok i::after{content:'✓';color:#fff;font-size:10px;display:block;text-align:center;line-height:11px}
textarea.ai{resize:vertical;min-height:54px}
@media(prefers-reduced-motion:reduce){.alogo .bb,.alogo .ln,.alogo .dt,.auc,.pr.ok i{animation:none}.alogo .ln{stroke-dashoffset:0}}
#umm{position:fixed;top:56px;inset-inline-end:12px;z-index:60;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;min-width:230px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#umm .btn{display:block;width:100%;margin-top:8px}
.bw{display:flex;flex-direction:column;align-items:flex-start;gap:4px}.rb{background:#0f766e;color:#fff;border:0;border-radius:6px;padding:4px 16px;font-weight:700;cursor:pointer;font-size:13px}.rb:hover{background:#115e59}.rb:disabled{opacity:.6;cursor:wait}#zp{margin-inline-end:8px}#rpw .sc{overflow:visible!important}#rpw svg{min-width:0!important;max-width:100%}
/* page name badge (top-right, alone) */
#pgn{display:none;justify-content:flex-end;direction:ltr;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 2px;background:transparent}
#pgn.on{display:flex}
#pgn span{display:inline-flex;align-items:center;gap:8px;padding:6px 20px 6px 14px;border-radius:99px;font-weight:700;font-size:17px;line-height:1.5;letter-spacing:.2px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:pgi .35s ease-out}

#pgn.ps span{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff}
#pgn.pm span{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a1300}
@keyframes pgi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#pgn span{animation:none}}

/* data page */
.dtb{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 12px}
.dtk{flex:1;min-width:130px;padding:10px 14px;border-radius:12px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.dtk small{display:block;opacity:.9;font-size:12px}.dtk b{font-size:18px;font-variant-numeric:tabular-nums}
.dtk.k1{background:linear-gradient(135deg,#0f766e,#0d9488)}.dtk.k2{background:linear-gradient(135deg,#0369a1,#0ea5e9)}.dtk.k3{background:linear-gradient(135deg,#b45309,#d97706)}.dtk.k4{background:linear-gradient(135deg,#15803d,#22a35a)}
.dtw{overflow:auto;max-height:68vh;border:1px solid var(--bd);border-radius:12px}

.dt th{position:sticky;top:0;z-index:2;color:#fff;padding:9px 10px;font-size:12.5px;white-space:nowrap;text-align:center;border:0}
.dt th.ix{background:#475569}.dt th.ty{background:#334155}.dt th.mo{background:#0f766e}.dt th.tx{background:#0369a1}.dt th.pn{background:#b45309}.dt th.ds{background:#b91c1c}.dt th.dp{background:#15803d}.dt th.cu{background:#6d28d9}

.dt input,.dt select{width:100%;min-width:84px;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 6px;text-align:center;-moz-appearance:textfield}

.dt td.ds input{color:var(--bad)}
.dtx{border:0;background:none;color:var(--bad);cursor:pointer;font-size:14px;padding:2px 8px;border-radius:6px}.dtx:hover{background:rgba(194,65,12,.15)}
.dtn{background:rgba(217,119,6,.12);border-inline-start:4px solid var(--b);border-radius:8px;padding:6px 10px;margin:6px 0 10px;font-size:13px}
.sb{position:relative;margin-bottom:10px}
.sbx{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:6px 8px}
.sbx:focus-within{border-color:var(--a);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
.sbx input{flex:1;min-width:140px;border:0;background:transparent;outline:0;padding:5px}
.chp{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:99px;font-size:12.5px;color:#fff}
.cf{background:#0f766e}.cg{background:#6d28d9}.ca{background:#b45309}
.chp button{border:0;background:rgba(255,255,255,.28);color:#fff;border-radius:50%;width:18px;height:18px;line-height:16px;cursor:pointer;padding:0}
.sbt{border:0;background:none;cursor:pointer;font-size:16px;color:var(--mu)}

.sbp h4{margin:0 0 6px;font-size:13px}.sbp label{display:block;margin:3px 0}.sbp select{margin-bottom:5px}

.mb{transform-box:fill-box;transform-origin:50% 100%;animation:abar 2.4s ease-in-out infinite}.mb.b2{animation-delay:.25s}.mb.b3{animation-delay:.5s}.mb.b4{animation-delay:.75s}

.dt tr.tt td{font-weight:700;background:rgba(217,119,6,.18)!important}
@media(prefers-reduced-motion:reduce){.mb,.ml,.md{animation:none}.ml{stroke-dashoffset:0}}
</style>

up:['To help the system read your file accurately, check before uploading:','لكي يقرأ النظام ملفك بدقة، تأكد قبل الرفع من التالي:'],

const fmc=n=>{const s=nf(Math.abs(n),Math.abs(n)<1000?2:0),g=n<0?'−':'';return S.cur=='USD'?g+'$'+s:g+s+' '+E('د.أ','JD')};

/* ---------- periods ---------- */
const inP=(p,r)=>S.P[p].has(key(r)),tot=p=>{const rs=S.rows.filter(r=>inP(p,r));return{rs,n:rs.length,sum:rs.reduce((a,r)=>a+r.v,0)}};
function lbl(p){const rs=tot(p).rs;if(!rs.length)return E('لم يتم الاختيار','nothing selected');const by={};rs.forEach(r=>(by[r.y]=by[r.y]||[]).push(r.m));
return Object.keys(by).map(y=>{const ms=by[y],o=[];let st=ms[0],pv=ms[0];for(let i=1;i<=ms.length;i++){if(ms[i]!==pv+1){o.push(st==pv?mn(st).slice(0,3):mn(st).slice(0,3)+'–'+mn(pv).slice(0,3));st=ms[i]}pv=ms[i]}return o.join(', ')+' '+y}).join(' · ')}

function pick(){const R=S.rows,ys=[...new Set(R.map(r=>r.y))],has=new Set(R.map(key)),A=tot('A'),B=tot('B'),M3=[...Array(12).keys()].map(m=>mn(m).slice(0,3));

function grp(A,B){const n=Math.max(A.length,B.length);if(!n)return `<p class="mu">${E('اختر أشهراً في الفترتين.','Choose months in the periods.')}</p>`;

let s=`<svg viewBox="0 0 ${W} ${H}">`;for(let i=0;i<=3;i++){const v=mx*i/3;s+=`<line x1="${P}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="0" y="${Y(v)+3}">${v>=1e3?Math.round(v/1e3)+'k':(mx<10?+v.toFixed(1):Math.round(v))}</text>`}
for(let i=0;i<n;i++){const x=P+i*bw,st=n>14&&i%2;[[A[i],'var(--c1)',.1,H-14],[B[i],'var(--c2)',.5,H-4]].forEach(z=>{if(!z[0])return;s+=`<rect x="${x+bw*z[2]}" y="${Y(z[0].v)}" width="${bw*.38}" height="${Y(0)-Y(z[0].v)}" rx="2" fill="${z[1]}"/>`;if(!st)s+=`<text x="${x+bw/2}" y="${z[3]}" text-anchor="middle" style="fill:${z[1]};font-size:9px">${L(z[0])}</text>`})}
return s+'</svg>'}
const nst=x=>{if(!(x>0))return 1;const p=10**Math.floor(Math.log10(x)),f=x/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p};
function plot(series,labels,o={}){const W=640,H=o.h||190,P=28,all=series.flatMap(s=>s.v).concat(o.band?o.band.flat():[]).filter(v=>v!=null);let mx=Math.max(...all,1),mnv=o.neg?Math.min(0,...all):0,tk=null;
if(o.neg){mx=Math.max(...all,0);const st=nst((mx-mnv)/4);mnv=Math.floor(mnv/st)*st;mx=Math.ceil(mx/st)*st;if(mx==mnv)mx=mnv+st;tk=[];for(let t=mnv;t<=mx+1e-9;t+=st)tk.push(t)}
const n=labels.length,wide=o.bars||o.lf,L0=P+(wide?16:0),RR=wide?30:6,X=i=>L0+i*(W-L0-RR)/(n-1||1),Y=v=>H-18-(v-mnv)/(mx-mnv||1)*(H-30);
let s=`<svg viewBox="0 0 ${W} ${H}">`;(tk||[0,1,2,3].map(i=>mnv+(mx-mnv)*i/3)).forEach(v=>{const y=Y(v);s+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="${o.neg&&v==0?'var(--mu)':'var(--bd)'}"/><text x="0" y="${y+3}">${o.pct?v.toFixed(0)+'%':v>=1e3?Math.round(v/1e3)+'k':(mx<10?+v.toFixed(1):Math.round(v))}</text>`});
labels.forEach((l,i)=>{if(i%(o.step||1)==0)s+=`<text x="${X(i)}" y="${H-4}" text-anchor="middle"${o.lf?` style="font-size:${o.lf}px"`:''}>${l}</text>`});
if(o.bars){const bw=(W-L0-RR)/n*.6;series[0].v.forEach((v,i)=>{if(v!=null){s+=`<rect x="${X(i)-bw/2}" y="${Y(Math.max(v,0))}" width="${bw}" height="${Math.abs(Y(v)-Y(0))}" rx="2" fill="${v<0?'var(--bad)':(o.col?o.col(i):series[0].c)}" opacity="${o.op?o.op(i):1}"/>`;if(o.vals)s+=`<text x="${X(i)}" y="${v>=0?Y(v)-3:Y(v)+10}" text-anchor="middle" style="fill:var(--tx);font-size:9px;font-weight:700">${o.vals(v,i)}</text>`}})}
else{if(o.band){let u='',d='';o.band.forEach((b,i)=>{if(b){u+=`${X(i)},${Y(b[1])} `;d=`${X(i)},${Y(b[0])} `+d}});s+=`<polygon points="${u}${d}" fill="var(--b)" opacity=".2"/>`}
series.forEach(se=>{let p='';se.v.forEach((v,i)=>{if(v!=null)p+=`${p?'L':'M'}${X(i)},${Y(v)}`});s+=`<path d="${p}" fill="none" stroke="${se.c}" stroke-width="${se.w||2}" ${se.d?'stroke-dasharray="5 4"':''}/>`;if(o.dots)se.v.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="${se.c}"/>`})})}
if(o.leg)s+=o.leg.map((l,i)=>`<text x="${P+8+i*(o.lg||110)}" y="10" style="fill:${series[i].c}">● ${l}</text>`).join('');
if(o.pts)o.pts.forEach(q=>{const x=X(q.i),y=Y(q.v),cl=q.up?'var(--ok)':'var(--bad)',ty=q.up&&y>=24?y-10:y+18;s+=`<circle cx="${x}" cy="${y}" r="6" fill="${cl}" stroke="var(--cd)" stroke-width="2"/><text x="${x}" y="${ty}" text-anchor="${x>W-70?'end':x<P+50?'start':'middle'}" style="fill:${cl};font-weight:700">${q.t}</text>`});

const aSeenKey=()=>'ssp_seenat_'+(A.user?A.user.id:'');
function aBadge(){const at=$('#adminTab');if(at&&A.prof&&A.prof.role=='admin')at.innerHTML=E('الطلبات','Requests')+` <span class="nb${A.nNew?' hot':''}">${A.nNew||0}</span>`}
async function aMarkSeen(){
 const now=new Date().toISOString();A.nNew=0;aBadge();
 try{localStorage.setItem(aSeenKey(),now)}catch(e){}
 try{if(A.sb)await A.sb.rpc('mark_requests_seen')}catch(e){}}
async function aCount(){
 if(!A.sb||!A.user||!A.prof||A.prof.role!='admin'||A.prof.status!='approved')return;
 try{
  const onAdm=$('#adm')&&$('#adm').classList.contains('on');if(onAdm){return aMarkSeen()}
  let seen=null;const me=await A.sb.from('profiles').select('req_seen_at').eq('id',A.user.id).maybeSingle();
  if(!me.error&&me.data&&me.data.req_seen_at)seen=me.data.req_seen_at;
  else{try{seen=localStorage.getItem(aSeenKey())}catch(e){}}
  const r=await A.sb.from('profiles').select('id,created_at').eq('status','pending');if(r.error)return;
  const t=seen?new Date(seen).getTime():0;
  A.nNew=r.data.filter(x=>new Date(x.created_at).getTime()>t).length;aBadge()}catch(e){}}
setInterval(aCount,30000);
